name: setup access-probe
description: >-
  Install access-probe 0.1.2, the execution adapter that exercises one
  credential-dependent operation in this job and records only its outcome,
  for TSquare. It installs the binary and nothing else: it reads no secret
  and runs no probe.

# Rendered by internal-sdlc-tooling's release for toolbelt-v0.1.2. Each
# platform's archive SHA-256 is pinned here, so pinning this action's commit
# pins the bytes the job runs. The archives are not signed: the SHA-256
# verifies the bytes, not who published them.

outputs:
  version:
    description: The installed access-probe version.
    value: "0.1.2"

runs:
  using: composite
  steps:
    - name: Install access-probe 0.1.2
      shell: bash
      env:
        VERSION: "0.1.2"
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) platform=linux-amd64 sha256=6a5669fe22ee44571cf76b2292aa0ddf7558f7386933c8a9b8ac750b345543ee ;;
          Linux-ARM64) platform=linux-arm64 sha256=518cd11a19e5e7cf0eedd11b39f46dd62af47d7963d32fe39cd5fa11ba5bf579 ;;
          macOS-X64) platform=darwin-amd64 sha256=c933527e39e2d5907377ba0c0b8bce949a1fff0656feecef9c7ea37a84494a7e ;;
          macOS-ARM64) platform=darwin-arm64 sha256=77d7dbafeef32af00ca19064ebe58a1112ea56bd70f9846505ba52a736fdd709 ;;
          *) echo "::error::access-probe ${VERSION} has no release for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        archive="access-probe-${VERSION}-${platform}.tar.gz"
        dir="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/access-probe/${VERSION}"
        mkdir -p "$dir"
        curl -fsSL --retry 3 --proto '=https' -o "$RUNNER_TEMP/$archive" \
          "https://github.com/ConnectedLabs/toolbelt/releases/download/toolbelt-v${VERSION}/${archive}"
        echo "${sha256}  $RUNNER_TEMP/$archive" | shasum -a 256 -c - >/dev/null ||
          { echo "::error::${archive} does not match the SHA-256 this action pins"; exit 1; }
        tar -xzf "$RUNNER_TEMP/$archive" -C "$dir" --strip-components 1 "access-probe-${VERSION}-${platform}/access-probe"
        rm -f "$RUNNER_TEMP/$archive"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/access-probe" version
