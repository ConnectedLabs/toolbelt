name: setup product-resolver
description: >-
  Install product-resolver 0.1.8 without resolving or updating a dependency
  lock. Registry credentials, when required by a later resolver invocation,
  remain the calling step's responsibility.

# Rendered by internal-sdlc-tooling's release for toolbelt-v0.1.8. Each
# platform archive's SHA-256 is pinned here, so pinning this action's commit
# pins the bytes the job runs. Installation does not contact an OCI registry.
# The archives are not signed: the SHA-256 verifies bytes, not who published
# them.

outputs:
  version:
    description: The installed product-resolver version.
    value: "0.1.8"
  path:
    description: The absolute path to product-resolver.
    value: ${{ steps.resolver.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install product-resolver 0.1.8
      id: resolver
      shell: bash
      env:
        VERSION: "0.1.8"
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) platform=linux-amd64 sha256=aa69b0dc167159919b271fe42851df8b79227e116e1ce26763317614175df204 ;;
          Linux-ARM64) platform=linux-arm64 sha256=c99419c2464ea43be8615b1b39ef377cba92d49fe7d635d6fe17b80331194400 ;;
          macOS-X64) platform=darwin-amd64 sha256=6d5401c7837d91bc02fb41daaa494a5798ec91acbc4e2a302909fe1e5c308152 ;;
          macOS-ARM64) platform=darwin-arm64 sha256=3d4bae580202489ffaa0b6e04edd02aeff01a0b210dc75ed6a6e71122a3f4dfa ;;
          *) echo "::error::product-resolver ${VERSION} has no release for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        archive="product-resolver-${VERSION}-${platform}.tar.gz"
        dir="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/product-resolver/${VERSION}"
        mkdir -p "$dir"
        curl -fsSL --retry 3 --proto '=https' -o "$RUNNER_TEMP/$archive" \
          "https://github.com/ConnectedLabs/toolbelt/releases/download/toolbelt-v${VERSION}/${archive}"
        echo "${sha256}  $RUNNER_TEMP/$archive" | shasum -a 256 -c - >/dev/null ||
          { echo "::error::${archive} does not match the SHA-256 this action pins"; exit 1; }
        tar -xzf "$RUNNER_TEMP/$archive" -C "$dir" --strip-components 1 \
          "product-resolver-${VERSION}-${platform}/product-resolver"
        rm -f "$RUNNER_TEMP/$archive"
        echo "$dir" >> "$GITHUB_PATH"
        echo "path=$dir/product-resolver" >> "$GITHUB_OUTPUT"

    - name: Validate product-resolver executable
      shell: bash
      env:
        PRODUCT_RESOLVER: ${{ steps.resolver.outputs.path }}
      run: |
        set -euo pipefail
        if output="$("$PRODUCT_RESOLVER" 2>&1)"; then
          echo "::error::product-resolver without an operation unexpectedly succeeded"
          exit 1
        fi
        grep -q '^usage:' <<<"$output"
